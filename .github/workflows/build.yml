# Geo Field – Build Action
# يبني التطبيق على Windows و Linux
# الاستخدام: ارفع المشروع على GitHub وسيشتغل تلقائياً عند كل Push

name: Build Geo Field

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # تشغيل يدوي من تبويب Actions

env:
  QT_VERSION: "6.7.2"
  APP_NAME: GeoField
  BUILD_TYPE: Release

jobs:
  # ========== Windows ==========
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtpositioning qtserialport"
          cache: true

      - name: Configure CMake
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR%

      - name: Build
        shell: cmd
        run: |
          cd build
          cmake --build . --config %BUILD_TYPE%

      - name: Deploy Qt DLLs (windeployqt)
        shell: cmd
        run: |
          cd build
          dir /s /b *.exe
          for /r %%i in (GeoField*.exe) do (
            windeployqt --qmldir ../resources/qml "%%i"
            copy "%%i" ..\GeoField.exe
          )

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-Windows
          path: |
            build/**/*.exe
            build/**/*.dll
            GeoField.exe
          if-no-files-found: warn

  # ========== Linux ==========
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtpositioning qtserialport"
          cache: true

      - name: Configure & Build
        run: |
          mkdir -p build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}"
          cmake --build .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-Linux
          path: build/GeoField*
          if-no-files-found: warn

  # ========== Android (اختياري – يحتاج secrets) ==========
  # لتشغيله: أضف في GitHub Secrets مفاتيح التوقيع إن لزم
  build-android:
    name: Build Android
    runs-on: ubuntu-22.04
    # عطّله افتراضياً لو مش مجهز SDK – شغّله يدوياً بعد ضبط البيئة
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: "qtpositioning qtserialport"
          cache: true

      - name: Build Android APK
        run: |
          mkdir -p build-android && cd build-android
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DANDROID_ABI=arm64-v8a
          cmake --build .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-Android
          path: |
            build-android/**/*.apk
            build-android/**/*.aab
          if-no-files-found: warn
