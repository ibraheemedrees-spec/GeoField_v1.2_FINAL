# Geo Field – Build Action (Windows + Linux + Android)
name: Build Geo Field

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  QT_VERSION: "6.7.2"
  BUILD_TYPE: Release

jobs:
  # ─────────────────────────────────────────────
  # Windows
  # ─────────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt (MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2019_64
          modules: "qtpositioning qtserialport qtconnectivity"
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: cmd
        run: |
          if exist build rmdir /s /q build
          mkdir build
          cd build
          cmake .. -G "Ninja" -DCMAKE_BUILD_TYPE=%BUILD_TYPE% -DCMAKE_PREFIX_PATH=%QT_ROOT_DIR% -DCMAKE_CXX_COMPILER=cl

      - name: Build
        shell: cmd
        run: |
          cd build
          cmake --build . --config %BUILD_TYPE%

      - name: Deploy Qt DLLs
        shell: cmd
        run: |
          cd build
          if exist bin\GeoField.exe (
            windeployqt --qmldir ../resources/qml bin\GeoField.exe
          ) else (
            for /r %%i in (GeoField*.exe) do windeployqt --qmldir ../resources/qml "%%i"
          )

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-Windows
          path: |
            build/bin/**
            build/**/GeoField.exe
            build/**/*.dll
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # Linux
  # ─────────────────────────────────────────────
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev \
            libdbus-1-dev libxcb-cursor0 libbluetooth-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: "qtpositioning qtserialport qtconnectivity"
          cache: true

      - name: Configure & Build
        run: |
          rm -rf build
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_PREFIX_PATH="${QT_ROOT_DIR}" \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY="${GITHUB_WORKSPACE}/build/bin"
          cmake --build .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-Linux
          path: |
            build/bin/GeoField
            build/GeoField
          if-no-files-found: warn

  # ─────────────────────────────────────────────
  # Android (arm64-v8a)
  # ─────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"
          yes | sdkmanager --licenses || true

      - name: Install Qt (Android + Host)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: "qtpositioning qtserialport qtconnectivity"
          extra: aqt install-qt linux desktop ${{ env.QT_VERSION }} linux_gcc_64 -m qtpositioning qtserialport qtconnectivity
          cache: true

      - name: Configure CMake (Android)
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          set -e
          rm -rf build-android
          mkdir -p build-android && cd build-android

          QT_ANDROID="${QT_ROOT_DIR}"
          QT_HOST=$(echo "${QT_ROOT_DIR}" | sed 's|android_arm64_v8a|gcc_64|')
          if [ ! -d "$QT_HOST" ]; then
            QT_HOST="${QT_ROOT_DIR}/../gcc_64"
          fi
          echo "QT_ANDROID=$QT_ANDROID"
          echo "QT_HOST=$QT_HOST"

          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_ROOT}/build/cmake/android.toolchain.cmake" \
            -DANDROID_STL=c++_shared \
            -DCMAKE_FIND_ROOT_PATH="${QT_ANDROID}" \
            -DCMAKE_PREFIX_PATH="${QT_ANDROID}" \
            -DQT_HOST_PATH="${QT_HOST}" \
            -DQT_NO_GLOBAL_APK_TARGET_PART_OF_ALL=ON

      - name: Build native library
        run: |
          cd build-android
          cmake --build . --target GeoField

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/android_debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=GeoField Debug,O=GeoField,C=EG" \
            -noprompt

      - name: Package & sign APK
        run: |
          set -e
          cd build-android

          DEPLOYQT=$(command -v androiddeployqt || true)
          if [ -z "$DEPLOYQT" ] || [ ! -x "$DEPLOYQT" ]; then
            DEPLOYQT="${QT_HOST_PATH}/bin/androiddeployqt"
          fi
          if [ ! -x "$DEPLOYQT" ]; then
            DEPLOYQT="${QT_ROOT_DIR}/../gcc_64/bin/androiddeployqt"
          fi
          echo "androiddeployqt: $DEPLOYQT"

          INPUT=$(ls android-*-deployment-settings.json 2>/dev/null | head -1)
          if [ -z "$INPUT" ]; then
            INPUT=$(find . -name "*deployment-settings.json" | head -1)
          fi
          echo "Input: $INPUT"

          mkdir -p android-build/libs/arm64-v8a
          find . -name "libGeoField*.so" -exec cp -f {} android-build/libs/arm64-v8a/ \;

          "$DEPLOYQT" \
            --input "$INPUT" \
            --output android-build \
            --android-platform android-34 \
            --jdk "$JAVA_HOME" \
            --gradle \
            --release \
            --sign "$GITHUB_WORKSPACE/android_debug.keystore" androiddebugkey \
            --storepass android \
            --keypass android

          echo "==== APK outputs ===="
          find . -name "*.apk" | head -20

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoField-Android
          path: |
            build-android/**/*.apk
            build-android/**/*.aab
            build-android/android-build/**/*.apk
            build-android/bin/**/*.so
          if-no-files-found: warn
